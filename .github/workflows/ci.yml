name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app

jobs:
  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert
          scopes: core, app, web, release, homebrew, ci, deps
          requireScope: false

  core:
    name: LokalCore (lint, build, test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Lint
        run: swift format lint --strict --recursive --configuration .swift-format app/LokalCore/Sources app/LokalCore/Tests app/LokalCore/Package.swift app/Lokal
      - name: Test
        working-directory: app/LokalCore
        run: swift test --parallel

  app:
    name: Lokal.app (build)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild -project Lokal.xcodeproj -scheme Lokal -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD "
      - name: Verify bundle
        run: |
          APP=app/build/DerivedData/Build/Products/Release/Lokal.app
          test -f "$APP/Contents/MacOS/Lokal"
          test -d "$APP/Contents/Frameworks/Sparkle.framework"
          /usr/libexec/PlistBuddy -c "Print :SUFeedURL" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" "$APP/Contents/Info.plist"

  web:
    name: Website (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build and type-check
        working-directory: web
        run: pnpm build
      - name: Verify prerendered output
        working-directory: web
        run: |
          test -f dist/client/index.html
          test -f dist/client/changelog.html
          test -f dist/client/appcast.xml
          grep -q "^/download " dist/client/_redirects

  homebrew:
    name: Cask style
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: brew style homebrew/Casks/lokal.rb

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scripts/*.sh app/scripts/*.sh
